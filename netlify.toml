[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# vite.config.ts reads NETLIFY, CONTEXT, and URL from the build environment to set the canonical
# URL, sitemap, and robots rules. Production deploys are indexable. Deploy previews and branch
# deploys get noindex so they never compete with the real site in search results.
# To use a custom domain for canonical URLs, set VITE_SITE_URL in the Netlify site settings.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints everything in /assets, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
