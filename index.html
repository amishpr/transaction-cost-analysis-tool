    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("tca-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && theme === "light") meta.setAttribute("content", "#f2f2ef");
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TCA Analyzer",
        "url": "__SITE_URL__/",
        "description": "A transaction cost analysis (TCA) dashboard for equity trades. Upload fills as CSV or Excel and measure slippage against arrival price and VWAP, broken down by symbol, execution strategy, venue, sector, and market cap.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any modern web browser",
        "browserRequirements": "Requires JavaScript",
        "image": "__SITE_URL__/og-image.png",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Slippage in basis points and dollars against arrival price and VWAP",
          "Cost breakdown by symbol, execution strategy, and venue",
          "Order size versus slippage bubble chart",
          "Sector and market cap composition",
          "CSV and Excel upload with CSV export",
          "Light and dark themes"
        ]
      }
    </script>
